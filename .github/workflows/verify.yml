name: Verify Windows source
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/workspace

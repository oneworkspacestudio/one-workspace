<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffaf3">
  <meta name="description" content="A gentle daily routine for toilet trips and bedtime.">
  <meta name="robots" content="noindex, nofollow">
  <title>Sunny &amp; Moon</title>
  <link rel="icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <div class="shell">
    <div class="landscape" aria-hidden="true">
      <div class="sky-glow"></div>
      <div class="sky-stars"></div>
      <div class="sky-cloud sky-cloud-west"></div>
      <div class="sky-cloud sky-cloud-east"></div>
      <div class="hill hill-west"></div>
      <div class="hill hill-east"></div>
      <div class="hill hill-near"></div>
    </div>
    <header class="topbar">
      <div class="brand">
        <img src="./assets/icon-192.png" width="30" height="30" alt="">
        <span>Sunny &amp; Moon</span>
      </div>
      <nav class="header-actions" aria-label="App controls">
        <a class="utility" href="/" data-workspace-apps-trigger>Apps</a>
        <button hidden class="utility" type="button" id="open-settings" aria-label="Settings" title="Settings">
          <img src="./assets/settings.png" width="21" height="21" alt="">
        </button>
      </nav>
    </header>

    <section class="session-panel" id="session-panel" aria-live="polite">
      <h1 id="session-message">Opening your routine…</h1>
      <a class="primary-button" id="sign-in" href="./auth/login" hidden>Continue with MyAccounts</a>
      <button class="primary-button" id="retry" type="button" hidden>Try again</button>
    </section>

    <main id="routine" class="game" aria-label="Sunny &amp; Moon" hidden>
      <section class="meters" aria-label="Body check-in">
        <p class="sr-only" id="meter-description">Bars follow the clock. Go when your body says it’s time.</p>
        <div class="meter meter-water">
          <div class="meter-label"><img src="./assets/drop.png" width="17" height="17" alt=""><label for="bladder">Bladder</label></div>
          <progress id="bladder" max="100" value="0" aria-describedby="meter-description"></progress>
        </div>
        <div class="meter meter-peach">
          <div class="meter-label"><img src="./assets/bowel.png" width="17" height="17" alt=""><label for="bowel">Bowel</label></div>
          <progress id="bowel" max="100" value="0" aria-describedby="meter-description"></progress>
        </div>
        <div class="meter meter-lilac">
          <div class="meter-label"><img src="./assets/rest.png" width="17" height="17" alt=""><label for="tiredness">Tiredness</label></div>
          <progress id="tiredness" max="100" value="0" aria-describedby="meter-description"></progress>
        </div>
      </section>

      <section class="bedtime" aria-labelledby="bedtime-heading">
        <h2 id="bedtime-heading"><img src="./assets/moon.png" width="18" height="18" alt=""> Bedtime</h2>
        <strong id="bedtime">9:00 pm</strong>
        <span id="bedtime-status" class="countdown"></span>
        <span id="sleep-estimate" class="sleep-estimate" title="Estimated sleep until wake-up"></span>
        <span id="reminder-title" class="reminder" aria-live="polite"></span>
      </section>

      <section class="sun-card" id="sun-card" data-mood="happy" data-cue="none" aria-labelledby="sun-message">
        <div class="scene" aria-hidden="true">
          <div class="halo"></div>
          <div class="orbit orbit-outer"></div><div class="orbit orbit-inner"></div>
          <span class="twinkle twinkle-left">✦</span><span class="twinkle twinkle-right">✧</span>
          <span class="twinkle twinkle-low">✦</span>
          <div class="sun" id="sun">
            <div class="rays">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
            <div class="face">
              <span class="brow brow-left"></span><span class="brow brow-right"></span>
              <span class="eye eye-left"><i></i></span><span class="eye eye-right"><i></i></span>
              <span class="cheek cheek-left"></span><span class="cheek cheek-right"></span>
              <span class="mouth"></span>
              <span class="arm arm-left"></span><span class="arm arm-right"></span>
            </div>
            <span class="sleep-mark"></span><span class="sleep-mark sleep-mark-small"></span>
            <span class="toilet-mark"><img src="./assets/toilet.png" width="24" height="24" alt=""></span>
            <span class="relief-mark"></span><span class="relief-mark relief-mark-small"></span>
          </div>
        </div>
        <h2 id="sun-message" aria-live="polite">Sunny is happy!</h2>
      </section>

      <div class="check-actions">
        <p class="check-feedback" id="feedback" role="status"></p>
        <button type="button" class="primary-button" id="visit">
          <img src="./assets/check.png" width="21" height="21" alt=""> I went to the toilet
        </button>
        <button type="button" class="primary-button" id="bedtime-visit" hidden>
          <img src="./assets/check.png" width="21" height="21" alt=""> I went before bed
        </button>
        <button type="button" class="text-button" id="open-earlier">Log an earlier visit</button>
      </div>
    </main>
  </div>

  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <form id="settings-form">
      <div class="dialog-heading">
        <h2 id="settings-title">Routine settings</h2>
        <button type="button" class="close-button" data-close="settings-dialog" aria-label="Close settings">×</button>
      </div>
      <label class="field">Bedtime <input type="time" name="bedtime" value="21:00" required></label>
      <label class="field">Wake-up time <input type="time" name="wake" value="07:00" required></label>
      <label class="field">Toilet reminder
        <select name="lead">
          <option value="15">15 minutes before bed</option>
          <option value="30">30 minutes before bed</option>
          <option value="45">45 minutes before bed</option>
          <option value="60" selected>1 hour before bed</option>
          <option value="90">1½ hours before bed</option>
        </select>
      </label>
      <p class="form-error" id="settings-error" role="alert"></p>
      <button class="primary-button" type="submit">Save routine</button>
    </form>
  </dialog>

  <dialog id="earlier-dialog" aria-labelledby="earlier-title">
    <form id="earlier-form">
      <div class="dialog-heading">
        <h2 id="earlier-title">Log an earlier visit</h2>
        <button type="button" class="close-button" data-close="earlier-dialog" aria-label="Close earlier visit">×</button>
      </div>
      <p>When did you go to the toilet?</p>
      <label class="field"><span id="visit-date">Visit time</span><input type="time" name="time" required></label>
      <p class="form-error" id="earlier-error" role="alert"></p>
      <button class="primary-button" type="submit">Save visit</button>
    </form>
  </dialog>
</body>
</html>

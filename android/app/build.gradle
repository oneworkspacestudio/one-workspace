plugins { id 'com.android.application' }
dependencyLocking { lockAllConfigurations() }
def signingValues=['WORKSPACE_ANDROID_KEYSTORE','WORKSPACE_ANDROID_STORE_PASSWORD','WORKSPACE_ANDROID_KEY_ALIAS','WORKSPACE_ANDROID_KEY_PASSWORD'].collect { System.getenv(it) }
android {
    namespace 'uk.co.m8e.workspace'
    compileSdk 35
    defaultConfig {
        applicationId 'uk.co.m8e.workspace'
        minSdk 28
        targetSdk 35
        versionCode 3
        versionName '0.1.0-preview.3'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs { release { if(signingValues.every{it}) { storeFile file(signingValues[0]);storePassword signingValues[1];keyAlias signingValues[2];keyPassword signingValues[3] } } }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
}
gradle.taskGraph.whenReady { graph -> if(graph.allTasks.any { it.name.toLowerCase().contains('release') }&&!signingValues.every{it})throw new GradleException('Release signing requires all four WORKSPACE_ANDROID signing environment values; debug keys are never used for release builds.') }
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.work:work-runtime:2.10.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

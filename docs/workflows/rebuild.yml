name: Rebuild offline installer
on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer version (new preview tag)
        required: true
        default: 0.1.0-preview.2
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - name: Verify version
        env:
          BUILD_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          if($env:BUILD_VERSION -notmatch '^\d+\.\d+\.\d+-preview\.\d+$'){throw 'Use a semantic preview version'}
      - name: Download pinned component seed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $lock=Get-Content components.lock.json -Raw|ConvertFrom-Json
          gh release download $lock.release -p components.zip -D seed
          $expected=$lock.sha256
          if((Get-FileHash seed/components.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected){throw 'Component seed digest mismatch'}
          Expand-Archive seed/components.zip seed/apps
      - run: go test ./...
      - run: go vet ./...
      - name: Package current manager and installer
        shell: pwsh
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: |
          ./scripts/build.ps1 -Version $env:BUILD_VERSION -Accounts seed/apps/MyAccounts.exe -Drive seed/apps/FileBrowser.exe -Photos seed/apps/Photos.exe -Cloudflared seed/apps/cloudflared.exe -ComponentNotices seed/apps/licenses/components
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-installer
          path: |
            dist/WorkspaceSetup-windows-amd64.exe
            dist/Workspace.exe
            dist/catalog.json
            dist/SHA256SUMS.txt
          retention-days: 14

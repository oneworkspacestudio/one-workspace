<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One Workspace logos</title><link rel="icon" href="../../internal/branding/icons/one_workspace.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#17233b;font:16px system-ui,sans-serif}main{max-width:1180px;margin:40px auto;padding:0 26px}header{display:flex;gap:20px;align-items:center;margin-bottom:32px}header img{width:72px;height:72px}h1{font-size:32px;margin:0 0 8px;letter-spacing:-1px}p{margin:0;color:#65718a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}article{background:white;border:1px solid #dfe5ef;border-radius:18px;overflow:hidden}h2{font-size:16px;margin:20px}.samples{display:flex;align-items:center;justify-content:center;gap:18px;height:136px;background:repeating-conic-gradient(#edf0f6 0% 25%,white 0% 50%) 50%/20px 20px}.samples img{width:80px;height:80px}.dark{background:#11182a}.small{display:flex;align-items:center;gap:14px;padding:20px;color:#7b879b;font-size:12px}.small img{flex:none}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:450px){.grid{grid-template-columns:1fr}}
</style></head><body><main><header><img src="../../internal/branding/icons/one_workspace.svg" alt=""><div><h1>One Workspace</h1><p>The complete app collection · shared blue artwork</p></div></header><div class="grid" id="logos"></div></main><script>
const apps=[["one_workspace","One Workspace"],["my_drive","Drive"],["my_office","Docs"],["my_photos","Photos"],["my_music","Music"],["my_git","Git"],["my_accounts","MyAccounts"],["photo_editor","Photo Editor"],["my_mail","Mail"],["my_calendar","Calendar"],["my_contacts","Contacts"],["my_notes","Notes"],["my_tube","My Tube"],["my_chat","Chat"],["my_vault","My Vault"],["my_hosting","My Hosting"],["my_tasks","My Tasks"],["my_pdf","My PDF"],["my_monitor","My Monitor"],["my_search","My Search"],["backups","Backups"],["my_slicer","My Slicer"],["my_social","My Social"],["my_clips","My Clips"],["my_maps","My Maps"],["my_meet","My Meet"],["my_create","My Create"],["my_3d","My 3D"],["my_ai","My AI"]];
document.querySelector('#logos').innerHTML=apps.map(([file,name])=>`<article><h2>${name}</h2><div class="samples"><img src="../../internal/branding/icons/${file}.svg" alt="${name}"></div><div class="samples dark"><img src="../../internal/branding/icons/${file}.svg" alt=""></div><div class="small"><img src="${file}-32.png" width="16" height="16" alt=""><img src="${file}-32.png" width="24" height="24" alt=""><img src="${file}-32.png" width="32" height="32" alt=""><span>16 · 24 · 32</span></div></article>`).join('');
</script></body></html>
